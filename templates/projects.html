{% extends "base.html" %}

{% block title %}{{ page_title }}{% endblock %}

{% block content %}
<article>
    <h1>{{ page_title }}</h1>

    <ul class="item-list">
        {% for project in projects %}
        <li>
            <a href="/projects/{{ project.slug }}">{{ project.title }}</a>
            <small>({{ project.date_str() }})</small>
        </li>
        {% endfor %}
    </ul>
</article>
{% endblock %}
